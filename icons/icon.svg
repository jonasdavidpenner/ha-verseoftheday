<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A5AAE"/>
      <stop offset="0.55" stop-color="#343B7E"/>
      <stop offset="1" stop-color="#262B60"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#FFF0C2"/>
      <stop offset="0.6" stop-color="#FCC65A"/>
      <stop offset="1" stop-color="#F3AE3E"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF0FF"/>
    </linearGradient>
  </defs>

  <!-- App-Hintergrund -->
  <rect x="0" y="0" width="256" height="256" rx="58" fill="url(#bg)"/>

  <!-- Sonnenstrahlen -->
  <g>
    <line x1="128.0" y1="58.0" x2="128.0" y2="45.0" stroke="#F7C463" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <line x1="148.0" y1="63.4" x2="154.5" y2="52.1" stroke="#F7C463" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <line x1="162.6" y1="78.0" x2="173.9" y2="71.5" stroke="#F7C463" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <line x1="168.0" y1="98.0" x2="181.0" y2="98.0" stroke="#F7C463" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <line x1="162.6" y1="118.0" x2="173.9" y2="124.5" stroke="#F7C463" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <line x1="148.0" y1="132.6" x2="154.5" y2="143.9" stroke="#F7C463" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <line x1="128.0" y1="138.0" x2="128.0" y2="151.0" stroke="#F7C463" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <line x1="108.0" y1="132.6" x2="101.5" y2="143.9" stroke="#F7C463" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <line x1="93.4" y1="118.0" x2="82.1" y2="124.5" stroke="#F7C463" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <line x1="88.0" y1="98.0" x2="75.0" y2="98.0" stroke="#F7C463" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <line x1="93.4" y1="78.0" x2="82.1" y2="71.5" stroke="#F7C463" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <line x1="108.0" y1="63.4" x2="101.5" y2="52.1" stroke="#F7C463" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Sonne -->
  <circle cx="128" cy="98" r="31" fill="url(#sun)"/>

  <!-- Kreuz (steigt aus der Buchmitte) -->
  <g fill="#FCC65A" stroke="#2A2F63" stroke-width="1.2">
    <rect x="124.5" y="132" width="7" height="30" rx="3"/>
    <rect x="114" y="141" width="28" height="7" rx="3"/>
  </g>

  <!-- Schatten unter dem Buch -->
  <ellipse cx="128" cy="210" rx="80" ry="9" fill="#000000" opacity="0.18"/>

  <!-- Aufgeschlagenes Buch -->
  <!-- linke Seite -->
  <path d="M56 162 Q92 152 126 160 L126 202 Q92 194 56 202 Z" fill="url(#page)" stroke="#C7D2F5" stroke-width="1"/>
  <!-- rechte Seite -->
  <path d="M200 162 Q164 152 130 160 L130 202 Q164 194 200 202 Z" fill="url(#page)" stroke="#C7D2F5" stroke-width="1"/>
  <!-- Buchruecken -->
  <path d="M126 160 Q128 159 130 160 L130 202 Q128 201 126 202 Z" fill="#D3DBF3"/>

  <!-- Textzeilen -->
  <g stroke="#AFC0EE" stroke-width="3" stroke-linecap="round">
    <line x1="68" y1="170" x2="116" y2="165.5"/>
    <line x1="68" y1="180" x2="116" y2="175.5"/>
    <line x1="68" y1="190" x2="112" y2="185.5"/>
    <line x1="140" y1="165.5" x2="188" y2="170"/>
    <line x1="140" y1="175.5" x2="188" y2="180"/>
    <line x1="140" y1="185.5" x2="184" y2="190"/>
  </g>
</svg>
